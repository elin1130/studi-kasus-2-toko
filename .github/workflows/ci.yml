name: C++ Automation Test

on:
  push:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Compile Program
      run: g++ "class Barang.cpp" -o toko

    - name: Run Program
      run: ./toko
